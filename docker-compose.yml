services:
  dougal:
    build: .
    container_name: dougal
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set the Telegram bot token}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:?Set the allowed Telegram user IDs, e.g. [123456789]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the OpenAI API key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:?Set the Home Assistant URL}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:?Set the Home Assistant token}
      DOUGAL_INDICATOR_LABEL: ${DOUGAL_INDICATOR_LABEL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
